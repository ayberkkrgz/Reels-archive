<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reels Takip">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14141a">
<title>Reels Takip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14141a;
    --surface:#1c1c24;
    --surface-2:#24242e;
    --border:rgba(255,255,255,.08);
    --border-strong:rgba(255,255,255,.16);
    --text:#f5f3ef;
    --text-muted:#9b98a8;
    --accent:#ff6b6b;
    --accent-2:#ffd166;
    --radius:14px;
    --radius-sm:9px;
    --font-display:'Space Grotesk',system-ui,-apple-system,sans-serif;
    --font-body:'Inter',system-ui,-apple-system,sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    padding-bottom:calc(96px + env(safe-area-inset-bottom));
    min-height:100vh;
  }
  ::selection{background:var(--accent); color:#14141a;}

  header{
    position:sticky; top:0; z-index:20;
    background:rgba(20,20,26,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--border);
    padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
  }
  .wordmark{
    font-family:var(--font-display);
    font-weight:700;
    font-size:19px;
    letter-spacing:-.01em;
    display:flex; align-items:center; gap:8px;
  }
  .wordmark .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none;}
  .stats-row{
    display:flex; gap:8px; overflow-x:auto; margin-top:12px;
    padding-bottom:2px; scrollbar-width:none;
  }
  .stats-row::-webkit-scrollbar{display:none;}
  .stat-pill{
    flex:none;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:999px;
    padding:6px 12px;
    font-size:12.5px;
    color:var(--text-muted);
    display:flex; align-items:center; gap:6px;
    white-space:nowrap;
  }
  .stat-pill b{color:var(--text); font-weight:600;}

  .toolbar{
    display:flex; gap:8px; padding:12px 16px 4px;
    align-items:center;
  }
  .toolbar-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--border);
    color:var(--text); font-family:var(--font-body); font-size:13px; font-weight:600;
    padding:8px 13px; border-radius:999px; cursor:pointer;
  }
  .toolbar-btn.active{border-color:var(--accent); color:var(--accent);}
  .toolbar-count{
    background:var(--accent); color:#14141a; font-size:11px; font-weight:700;
    border-radius:999px; min-width:16px; height:16px; padding:0 4px;
    display:flex; align-items:center; justify-content:center;
  }
  .result-count{font-size:12.5px; color:var(--text-muted); margin-left:auto;}

  #list{padding:8px 16px 16px; display:flex; flex-direction:column; gap:12px;}
  .card{
    position:relative;
    background:var(--surface);
    border:1px solid var(--border);
    border-left:4px solid var(--card-accent, var(--border));
    border-radius:var(--radius);
    padding:12px 14px;
    cursor:pointer;
    overflow:hidden;
    display:flex; gap:12px;
  }
  .card-poster{
    width:70px; height:105px; border-radius:8px; background-size:cover; 
    background-position:center; flex:none; background-color:var(--surface-2);
    display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:20px;
  }
  .card-content{flex:1; display:flex; flex-direction:column;}
  .card:active{background:var(--surface-2);}
  .card-top{display:flex; align-items:center; gap:8px; margin-bottom:4px;}
  .tag{display:flex; align-items:center; gap:5px; font-size:11.5px; color:var(--text-muted); font-weight:500;}
  .tag .swatch{width:7px; height:7px; border-radius:50%; flex:none;}
  .card-top .spacer{flex:1;}
  .prio-flag{font-size:13px;}
  .card-title{font-family:var(--font-display); font-weight:600; font-size:16px; line-height:1.3; margin:2px 0 4px;}
  .card-meta{display:flex; align-items:center; gap:10px; font-size:12.5px; color:var(--text-muted); margin-bottom:6px;}
  .stars{color:var(--accent-2); font-weight:600;}
  .card-note{font-size:12.5px; color:var(--text-muted); line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .card-bottom{display:flex; align-items:center; gap:8px; margin-top:auto; padding-top:6px;}
  .status-badge{display:flex; align-items:center; gap:5px; font-size:11px; font-weight:600; padding:3px 8px; border-radius:999px; background:var(--surface-2);}
  .status-badge .swatch{width:6px;height:6px;border-radius:50%;}
  .action-btns{margin-left:auto; display:flex; gap:6px;}
  .link-btn{
    width:28px; height:28px; border-radius:50%;
    background:var(--surface-2); border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center;
    color:var(--text); text-decoration:none; font-size:13px; flex:none;
  }

  .search-results{
    background:var(--surface-2); border:1px solid var(--border-strong);
    border-radius:var(--radius-sm); max-height:220px; overflow-y:auto;
    margin-top:4px; display:none; position:relative; z-index:10;
  }
  .search-item{
    padding:8px 12px; font-size:13px; display:flex; align-items:center; gap:10px; cursor:pointer;
    border-bottom:1px solid var(--border);
  }
  .search-item:last-child{border-bottom:none;}
  .search-item img{width:32px; height:48px; object-fit:cover; border-radius:4px; background:var(--surface);}

  .input-with-btn { display: flex; gap: 6px; }
  .input-with-btn input { flex: 1; }
  .btn-inline {
    background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
    padding: 0 12px; border-radius: var(--radius-sm); font-size: 12px; font-weight: 600;
    cursor: pointer; white-space: nowrap; display: flex; align-items: center; justify-content: center;
  }

  .fab{
    position:fixed; right:18px; bottom:calc(20px + env(safe-area-inset-bottom));
    width:56px; height:56px; border-radius:50%;
    background:var(--accent); color:#14141a;
    display:flex; align-items:center; justify-content:center;
    font-size:26px; font-weight:700; border:none;
    box-shadow:0 8px 20px rgba(255,107,107,.35);
    z-index:25; cursor:pointer;
  }
  .overlay{position:fixed; inset:0; background:rgba(10,10,13,.6); z-index:40; display:none; align-items:flex-end;}
  .overlay.open{display:flex;}
  .sheet{
    background:var(--bg); width:100%; max-height:92vh; overflow-y:auto;
    border-radius:20px 20px 0 0; border-top:1px solid var(--border-strong);
    padding:8px 18px calc(24px + env(safe-area-inset-bottom));
    animation:slideUp .22s ease-out;
  }
  @keyframes slideUp{from{transform:translateY(24px); opacity:.6;} to{transform:translateY(0); opacity:1;}}
  .sheet-handle{width:36px; height:4px; background:var(--border-strong); border-radius:99px; margin:8px auto 14px;}
  .sheet h2{font-family:var(--font-display); font-size:19px; margin:0 0 16px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--text-muted); font-weight:600; margin-bottom:6px;}
  .field input[type=text], .field input[type=url], .field select, .field textarea{
    width:100%; background:var(--surface); border:1px solid var(--border);
    color:var(--text); font-family:var(--font-body); font-size:15px;
    padding:11px 12px; border-radius:var(--radius-sm); appearance:none;
  }
  .field textarea{resize:vertical; min-height:70px;}
  .range-row{display:flex; align-items:center; gap:12px;}
  .range-row input[type=range]{flex:1; accent-color:var(--accent-2);}
  .range-val{font-family:var(--font-display); font-weight:700; font-size:16px; min-width:65px; text-align:right; color:var(--accent-2);}
  .chip-group{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{
    border:1px solid var(--border); border-radius:999px; padding:7px 12px;
    font-size:13px; color:var(--text-muted); display:flex; align-items:center; gap:6px; cursor:pointer;
    background:var(--surface);
  }
  .chip.active{color:var(--text); border-color:var(--border-strong); background:var(--surface-2);}
  .sheet-actions, .filter-actions{display:flex; gap:10px; margin-top:16px;}
  .btn{flex:1; border:none; border-radius:var(--radius-sm); padding:13px; font-size:15px; font-weight:700; cursor:pointer;}
  .btn-primary{background:var(--accent); color:#14141a;}
  .btn-ghost{background:var(--surface); color:var(--text); border:1px solid var(--border);}
  .btn-danger{background:transparent; color:#f27171; text-decoration:underline; padding:13px 4px; flex:none;}
  .toast{
    position:fixed; left:50%; bottom:calc(90px + env(safe-area-inset-bottom)); transform:translateX(-50%);
    background:var(--surface-2); border:1px solid var(--border-strong); color:var(--text);
    padding:10px 16px; border-radius:999px; font-size:13px; z-index:60; display:none;
    box-shadow:0 10px 25px rgba(0,0,0,0.5); text-align:center;
  }
  .toast.show{display:block;}
  .empty{text-align:center; padding:70px 30px 30px; color:var(--text-muted);}
</style>
</head>
<body>

<header>
  <div class="wordmark"><span class="dot"></span>Reels Takip</div>
  <div class="stats-row" id="statsRow"></div>
</header>

<div class="toolbar">
  <button class="toolbar-btn" id="filterBtn">⚲ Filtrele <span class="toolbar-count" id="filterCount" style="display:none">0</span></button>
  <span class="result-count" id="resultCount"></span>
</div>

<div id="list"></div>

<button class="fab" id="addBtn" aria-label="Yeni kayıt ekle">+</button>

<div class="overlay" id="formOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2 id="formTitle">Yeni kayıt</h2>
    <form id="entryForm">
      <div class="field">
        <label for="f_kategori">Kategori</label>
        <select id="f_kategori" required></select>
      </div>
      <div class="field">
        <label for="f_isim">İsim (Film/Dizi Arama)</label>
        <input type="text" id="f_isim" placeholder="Film veya dizi adı..." required autocomplete="off">
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="field">
        <label for="f_poster_url">Afiş URL (Otomatik / Manuel)</label>
        <div class="input-with-btn">
          <input type="url" id="f_poster_url" placeholder="Görsel bağlantısı...">
          <button type="button" class="btn-inline" id="googleSearchBtn">🔎 Google'da Bul</button>
        </div>
      </div>
      <div class="field">
        <label for="f_tur_select">Tür</label>
        <select id="f_tur_select"></select>
      </div>
      <div class="field" id="customTurGroup" style="display:none;">
        <label for="f_tur_custom">Özel Tür Yazın</label>
        <input type="text" id="f_tur_custom">
      </div>
      <div class="field">
        <label for="f_link">Instagram / Reels Linki</label>
        <input type="url" id="f_link" placeholder="https://www.instagram.com/reel/...">
      </div>
      <div class="field">
        <label for="f_durum">Durum</label>
        <select id="f_durum" required></select>
      </div>
      <div class="field">
        <label for="f_oncelik">Öncelik</label>
        <select id="f_oncelik" required></select>
      </div>
      <div class="field">
        <label for="f_puan">Puan</label>
        <div class="range-row">
          <input type="range" id="f_puan" min="1" max="10" value="7">
          <span class="range-val" id="f_puanVal">⭐ 7</span>
        </div>
      </div>
      <div class="field">
        <label for="f_not">Not — neden kaydettim?</label>
        <textarea id="f_not" placeholder="Bunu neden kaydettiğini kısaca yaz..."></textarea>
      </div>
      <div class="sheet-actions">
        <button type="button" class="btn btn-danger" id="deleteBtn" style="display:none">Sil</button>
        <button type="button" class="btn btn-ghost" id="cancelBtn">Vazgeç</button>
        <button type="submit" class="btn btn-primary">Kaydet</button>
      </div>
    </form>
  </div>
</div>

<div class="overlay" id="filterOverlay">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h2>Filtrele</h2>
    <div class="field">
      <label>Kategori</label>
      <div class="chip-group" id="filterCats"></div>
    </div>
    <div class="field">
      <label>Tür</label>
      <div class="chip-group" id="filterGenres"></div>
    </div>
    <div class="field">
      <label>Durum</label>
      <div class="chip-group" id="filterStatus"></div>
    </div>
    <div class="field">
      <label>Öncelik</label>
      <div class="chip-group" id="filterPriority"></div>
    </div>
    <div class="field">
      <label>Minimum Puan</label>
      <div class="range-row">
        <input type="range" id="filterPuan" min="1" max="10" value="1">
        <span class="range-val" id="filterPuanVal">⭐ 1+</span>
      </div>
    </div>
    <div class="filter-actions">
      <button type="button" class="btn btn-ghost" id="clearFiltersBtn">Temizle</button>
      <button type="button" class="btn btn-primary" id="applyFiltersBtn">Uygula</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const TMDB_API_KEY = "3fd2be6f0c70a2a598f084dd1fb0fe19";

// GOOGLE CUSTOM SEARCH API ANAHTARLARINIZ (İhtiyaca göre doldurabilirsiniz)
const GOOGLE_CSE_API_KEY = ""; 
const GOOGLE_CSE_CX = "";

const CATS = [
  {n:"Film", c:"#ff8fa3"}, {n:"Dizi", c:"#8fb8ff"}, {n:"Anime", c:"#7fe0c0"},
  {n:"Manga", c:"#ffb37f"}, {n:"Kitap", c:"#d7b77a"}, {n:"Oyun", c:"#bedd7f"},
  {n:"Ekstra (Diğer)", c:"#e39bff"}
];

const GENRES = [
  "Aksiyon", "Animasyon", "Belgesel", "Bilim Kurgu", "Biyografi", 
  "Dram", "Fantastik", "Gerilim", "Gizem", "Komedi", "Korku", 
  "Macera", "Müzikal", "Polisiye", "Psikolojik", "Romantik", 
  "Savaş", "Suç", "Tarih", "Western"
];

const STATUSES = [
  {n:"İzlenecek", c:"#5ec8f2"}, {n:"Devam Ediyor", c:"#ffcb5e"},
  {n:"Bitti", c:"#6fcf97"}, {n:"Yarıda Bırakıldı", c:"#f27171"}, {n:"Askıda", c:"#c792ea"}
];

const PRIORITIES = [
  {n:"Düşük", c:"#6fcf97"}, {n:"Orta", c:"#ffcb5e"}, {n:"Yüksek", c:"#f27171"}
];

const byName = (arr, n) => arr.find(x => x.n === n) || {n, c:"#8c8c99"};
const STORAGE_KEY = "entries";

let entries = [];
let editingId = null;
let filters = { cats: new Set(), genres: new Set(), status: new Set(), prio: new Set(), minPuan: 1 };

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

function normalizeString(str) {
  if (!str) return '';
  return str
    .toString()
    .trim()
    .toLowerCase()
    .replace(/[\s\-_:;.,'"!@#$%^&*()]/g, '');
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

function loadEntries(){
  try{
    const raw = window.localStorage.getItem(STORAGE_KEY);
    entries = raw ? JSON.parse(raw) : [];
  }catch(err){ entries = []; }
  render();
}

function persistLocal(){
  try{
    window.localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
  }catch(err){ showToast("Kaydedilemedi!"); }
}

function computeStats(){
  const total = entries.length;
  const count = (arr, field, val) => arr.filter(e => e[field] === val).length;
  const izlenecek = count(entries,'durum','İzlenecek');
  const devam = count(entries,'durum','Devam Ediyor');
  const bitti = count(entries,'durum','Bitti');
  const yuksek = count(entries,'oncelik','Yüksek');
  const avg = total ? (entries.reduce((s,e)=>s+Number(e.puan||0),0)/total).toFixed(1) : '0.0';
  return {total, izlenecek, devam, bitti, yuksek, avg};
}

function renderStats(){
  const s = computeStats();
  document.getElementById('statsRow').innerHTML = `
    <div class="stat-pill">📦 <b>${s.total}</b> kayıt</div>
    <div class="stat-pill">👀 <b>${s.izlenecek}</b> izlenecek</div>
    <div class="stat-pill">▶ <b>${s.devam}</b> devam ediyor</div>
    <div class="stat-pill">✅ <b>${s.bitti}</b> bitti</div>
    <div class="stat-pill">⭐ <b>${s.avg}</b> ort. puan</div>
    <div class="stat-pill">🔥 <b>${s.yuksek}</b> yüksek öncelik</div>
  `;
}

function passesFilters(e){
  if(filters.cats.size && !filters.cats.has(e.kategori)) return false;
  if(filters.genres.size && !filters.genres.has(e.tur)) return false;
  if(filters.status.size && !filters.status.has(e.durum)) return false;
  if(filters.prio.size && !filters.prio.has(e.oncelik)) return false;
  if(Number(e.puan || 0) < filters.minPuan) return false;
  return true;
}

function render(){
  renderStats();
  const list = document.getElementById('list');
  const visible = entries.filter(passesFilters).sort((a,b)=>b.createdAt-a.createdAt);
  document.getElementById('resultCount').textContent = visible.length !== entries.length
    ? `${visible.length}/${entries.length}` : '';

  const activeFilters = filters.cats.size + filters.genres.size + filters.status.size + filters.prio.size + (filters.minPuan > 1 ? 1 : 0);
  const fc = document.getElementById('filterCount');
  document.getElementById('filterBtn').classList.toggle('active', activeFilters>0);
  fc.style.display = activeFilters ? 'flex' : 'none';
  fc.textContent = activeFilters;

  if(!visible.length){
    list.innerHTML = entries.length
      ? `<div class="empty"><h3>Sonuç yok</h3><p>Filtrelere uyan kayıt bulunamadı.</p></div>`
      : `<div class="empty"><h3>Henüz kayıt yok</h3><p>Sağ alttaki + butonuna dokunup ilk kaydını ekle.</p></div>`;
    return;
  }

  list.innerHTML = visible.map(e => {
    const cat = byName(CATS, e.kategori);
    const st = byName(STATUSES, e.durum);
    const prioFlag = e.oncelik === 'Yüksek' ? '<span class="prio-flag">🔥</span>' : '';
    const posterStyle = e.posterUrl ? `style="background-image:url('${e.posterUrl}')"` : '';
    const watchLink = `https://www.justwatch.com/tr/arama?q=${encodeURIComponent(e.isim)}`;

    return `
    <div class="card" style="--card-accent:${st.c}" data-id="${e.id}">
      <div class="card-poster" ${posterStyle}>${!e.posterUrl ? '🎬' : ''}</div>
      <div class="card-content">
        <div class="card-top">
          <span class="tag"><span class="swatch" style="background:${cat.c}"></span>${e.kategori}${e.tur ? ' · '+e.tur : ''}</span>
          <span class="spacer"></span>
          ${prioFlag}
        </div>
        <div class="card-title">${escapeHtml(e.isim)}</div>
        <div class="card-meta"><span class="stars">⭐ ${e.puan}/10</span></div>
        ${e.not ? `<div class="card-note">${escapeHtml(e.not)}</div>` : ''}
        <div class="card-bottom">
          <span class="status-badge"><span class="swatch" style="background:${st.c}"></span>${e.durum}</span>
          <div class="action-btns">
            <a class="link-btn" title="Hangi Platformda Var? (JustWatch)" href="${watchLink}" target="_blank" onclick="event.stopPropagation()">🔍</a>
            ${e.link ? `<a class="link-btn" title="Reels Linki" href="${escapeAttr(e.link)}" target="_blank" onclick="event.stopPropagation()">↗</a>` : ''}
          </div>
        </div>
      </div>
    </div>`;
  }).join('');

  list.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openForm(card.dataset.id));
  });
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(s){ return escapeHtml(s); }

function fillSelect(sel, items, withPlaceholder){
  sel.innerHTML = (withPlaceholder ? `<option value="">Seç...</option>` : '') +
    items.map(i => `<option value="${i.n || i}">${i.n || i}</option>`).join('');
}

fillSelect(document.getElementById('f_kategori'), CATS, true);
fillSelect(document.getElementById('f_durum'), STATUSES, true);
fillSelect(document.getElementById('f_oncelik'), PRIORITIES, true);

const genreSel = document.getElementById('f_tur_select');
genreSel.innerHTML = `<option value="">Seç...</option>` + 
  GENRES.map(g => `<option value="${g}">${g}</option>`).join('') +
  `<option value="__CUSTOM__">✏️ Diğer (Kendim Yazacağım)</option>`;

genreSel.addEventListener('change', () => {
  document.getElementById('customTurGroup').style.display = genreSel.value === '__CUSTOM__' ? 'block' : 'none';
});

const isimInput = document.getElementById('f_isim');
const searchResults = document.getElementById('searchResults');
const posterInput = document.getElementById('f_poster_url');
let searchTimeout = null;

// AFİŞ ARAMA ALGORİTMASI: 1. JUSTWATCH -> 2. GOOGLE IMAGE API -> 3. TMDB FALLBACK
async function autoFetchPoster(queryName) {
  if (!queryName || queryName.length < 2) return '';

  // 1. ÖNCELİK: JUSTWATCH
  try {
    const jwRes = await fetch(`https://apis.justwatch.com/content/titles/tr_TR/popular?body=${encodeURIComponent(JSON.stringify({query: queryName}))}`);
    if (jwRes.ok) {
      const jwData = await jwRes.json();
      if (jwData.items && jwData.items.length > 0) {
        const item = jwData.items[0];
        if (item.poster) {
          const posterPath = item.poster.replace("{profile}", "s592");
          return `https://images.justwatch.com${posterPath}`;
        }
      }
    }
  } catch (err) {}

  // 2. ÖNCELİK: GOOGLE CUSTOM SEARCH API (API Anahtarı varsa)
  if (GOOGLE_CSE_API_KEY && GOOGLE_CSE_CX) {
    try {
      const gRes = await fetch(`https://www.googleapis.com/customsearch/v1?key=${GOOGLE_CSE_API_KEY}&cx=${GOOGLE_CSE_CX}&q=${encodeURIComponent(queryName + ' afiş poster')}&searchType=image&num=1`);
      if (gRes.ok) {
        const gData = await gRes.json();
        if (gData.items && gData.items[0] && gData.items[0].link) {
          return gData.items[0].link;
        }
      }
    } catch (err) {}
  }

  // 3. ÖNCELİK: TMDB FALLBACK
  try {
    const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&language=tr-TR&query=${encodeURIComponent(queryName)}`);
    if (res.ok) {
      const data = await res.json();
      const match = data.results && data.results.find(x => x.poster_path);
      if (match && match.poster_path) return `https://image.tmdb.org/t/p/w500${match.poster_path}`;
    }
  } catch (err) {}

  return '';
}

document.getElementById('googleSearchBtn').addEventListener('click', () => {
  const query = isimInput.value.trim();
  if (!query) {
    showToast("Önce bir isim yazın!");
    return;
  }
  window.open(`https://www.google.com/search?tbm=isch&q=${encodeURIComponent(query + ' poster afiş')}`, '_blank');
});

// ARAMA VE TAMAMLAMA LİSTESİ (JUSTWATCH VE TMDB DESTEKLİ)
isimInput.addEventListener('input', () => {
  clearTimeout(searchTimeout);
  const query = isimInput.value.trim();
  
  if (query.length < 2) {
    searchResults.style.display = 'none';
    return;
  }

  searchTimeout = setTimeout(async () => {
    let items = [];

    // Önce JustWatch Sonuçlarını Al
    try {
      const jwRes = await fetch(`https://apis.justwatch.com/content/titles/tr_TR/popular?body=${encodeURIComponent(JSON.stringify({query: query}))}`);
      if (jwRes.ok) {
        const jwData = await jwRes.json();
        if (jwData.items && jwData.items.length > 0) {
          items = jwData.items.slice(0, 5).map(x => ({
            title: x.title,
            year: x.original_release_year ? `(${x.original_release_year})` : '',
            poster: x.poster ? `https://images.justwatch.com${x.poster.replace("{profile}", "s166")}` : '',
            fullPoster: x.poster ? `https://images.justwatch.com${x.poster.replace("{profile}", "s592")}` : ''
          }));
        }
      }
    } catch (err) {}

    // JustWatch Sonucu Yoksa TMDB Sonuçlarını Al
    if (items.length === 0) {
      try {
        const res = await fetch(`https://api.themoviedb.org/3/search/multi?api_key=${TMDB_API_KEY}&language=tr-TR&query=${encodeURIComponent(query)}`);
        if (res.ok) {
          const data = await res.json();
          if (data.results && data.results.length > 0) {
            items = data.results.filter(x => x.title || x.name).slice(0, 5).map(x => {
              const date = x.release_date || x.first_air_date || '';
              return {
                title: x.title || x.name,
                year: date ? `(${date.substring(0, 4)})` : '',
                poster: x.poster_path ? `https://image.tmdb.org/t/p/w92${x.poster_path}` : '',
                fullPoster: x.poster_path ? `https://image.tmdb.org/t/p/w500${x.poster_path}` : ''
              };
            });
          }
        }
      } catch (err) {}
    }

    if (items.length > 0) {
      searchResults.innerHTML = items.map(item => `
        <div class="search-item" data-title="${escapeAttr(item.title)}" data-poster="${item.fullPoster}">
          ${item.poster ? `<img src="${item.poster}" alt="">` : '<div style="width:32px;height:48px;background:#333;border-radius:4px;"></div>'}
          <div><b>${escapeHtml(item.title)}</b> ${item.year}</div>
        </div>
      `).join('');
      searchResults.style.display = 'block';

      searchResults.querySelectorAll('.search-item').forEach(el => {
        el.addEventListener('click', () => {
          isimInput.value = el.dataset.title;
          if (el.dataset.poster) posterInput.value = el.dataset.poster;
          searchResults.style.display = 'none';
        });
      });
    } else {
      searchResults.style.display = 'none';
    }
  }, 300);
});

isimInput.addEventListener('blur', async () => {
  setTimeout(async () => {
    searchResults.style.display = 'none';
    if (isimInput.value.trim() && !posterInput.value.trim()) {
      const fetchedPoster = await autoFetchPoster(isimInput.value.trim());
      if (fetchedPoster) posterInput.value = fetchedPoster;
    }
  }, 200);
});

const puanInput = document.getElementById('f_puan');
const puanVal = document.getElementById('f_puanVal');
puanInput.addEventListener('input', () => puanVal.textContent = `⭐ ${puanInput.value}`);

function openForm(id){
  editingId = id || null;
  const form = document.getElementById('entryForm');
  form.reset();
  posterInput.value = '';
  document.getElementById('customTurGroup').style.display = 'none';
  searchResults.style.display = 'none';
  document.getElementById('deleteBtn').style.display = editingId ? 'block' : 'none';
  document.getElementById('formTitle').textContent = editingId ? 'Kaydı düzenle' : 'Yeni kayıt';

  if(editingId){
    const e = entries.find(x => x.id === editingId);
    document.getElementById('f_kategori').value = e.kategori || '';
    document.getElementById('f_isim').value = e.isim || '';
    posterInput.value = e.posterUrl || '';
    
    if(e.tur && GENRES.includes(e.tur)){
      genreSel.value = e.tur;
    } else if(e.tur) {
      genreSel.value = '__CUSTOM__';
      document.getElementById('customTurGroup').style.display = 'block';
      document.getElementById('f_tur_custom').value = e.tur;
    }

    document.getElementById('f_link').value = e.link || '';
    document.getElementById('f_durum').value = e.durum || '';
    document.getElementById('f_oncelik').value = e.oncelik || '';
    puanInput.value = e.puan || 7;
    document.getElementById('f_not').value = e.not || '';
  } else {
    puanInput.value = 7;
  }
  puanVal.textContent = `⭐ ${puanInput.value}`;
  document.getElementById('formOverlay').classList.add('open');
}

function closeForm(){ document.getElementById('formOverlay').classList.remove('open'); editingId = null; }

document.getElementById('addBtn').addEventListener('click', () => openForm(null));
document.getElementById('cancelBtn').addEventListener('click', closeForm);

document.getElementById('entryForm').addEventListener('submit', async e => {
  e.preventDefault();
  const kategori = document.getElementById('f_kategori').value;
  const durum = document.getElementById('f_durum').value;
  const oncelik = document.getElementById('f_oncelik').value;
  const isim = document.getElementById('f_isim').value.trim();

  const normalizedNewName = normalizeString(isim);
  const exists = entries.some(x => {
    if (editingId && x.id === editingId) return false;
    return normalizeString(x.isim) === normalizedNewName;
  });

  if (exists) {
    showToast(`⚠️ "${isim}" zaten listenizde ekli!`);
    return;
  }

  let finalTur = genreSel.value;
  if(finalTur === '__CUSTOM__'){
    finalTur = document.getElementById('f_tur_custom').value.trim();
  }

  let finalPosterUrl = posterInput.value.trim();
  if (!finalPosterUrl && isim) {
    finalPosterUrl = await autoFetchPoster(isim);
  }

  const data = {
    kategori,
    isim,
    posterUrl: finalPosterUrl,
    tur: finalTur,
    link: document.getElementById('f_link').value.trim(),
    durum,
    oncelik,
    puan: Number(puanInput.value),
    not: document.getElementById('f_not').value.trim(),
  };

  if(editingId){
    const idx = entries.findIndex(x => x.id === editingId);
    entries[idx] = { ...entries[idx], ...data };
  } else {
    entries.push({ id: uid(), createdAt: Date.now(), ...data });
  }
  persistLocal();
  closeForm();
  render();
});

document.getElementById('deleteBtn').addEventListener('click', () => {
  if(!confirm('Bu kaydı silmek istediğinize emin misiniz?')) return;
  entries = entries.filter(x => x.id !== editingId);
  persistLocal();
  closeForm();
  render();
});

function buildFilterChips(){
  const mk = (container, items, set) => {
    container.innerHTML = items.map(i => {
      const val = i.n || i;
      const color = i.c || '#8c8c99';
      return `<div class="chip" data-n="${val}"><span class="swatch" style="background:${color}"></span>${val}</div>`;
    }).join('');

    container.querySelectorAll('.chip').forEach(chip => {
      if(set.has(chip.dataset.n)) chip.classList.add('active');
      chip.addEventListener('click', () => {
        chip.classList.toggle('active');
        if(set.has(chip.dataset.n)) set.delete(chip.dataset.n); else set.add(chip.dataset.n);
      });
    });
  };

  const allUsedGenres = Array.from(new Set([...GENRES, ...entries.map(e => e.tur).filter(Boolean)]));

  mk(document.getElementById('filterCats'), CATS, filters.cats);
  mk(document.getElementById('filterGenres'), allUsedGenres, filters.genres);
  mk(document.getElementById('filterStatus'), STATUSES, filters.status);
  mk(document.getElementById('filterPriority'), PRIORITIES, filters.prio);
}

document.getElementById('filterBtn').addEventListener('click', () => {
  buildFilterChips();
  document.getElementById('filterOverlay').classList.add('open');
});

document.getElementById('filterOverlay').addEventListener('click', e => { 
  if(e.target.id==='filterOverlay') document.getElementById('filterOverlay').classList.remove('open'); 
});

document.getElementById('applyFiltersBtn').addEventListener('click', () => {
  filters.minPuan = Number(document.getElementById('filterPuan').value);
  document.getElementById('filterOverlay').classList.remove('open');
  render();
});

document.getElementById('clearFiltersBtn').addEventListener('click', () => {
  filters = { cats:new Set(), genres:new Set(), status:new Set(), prio:new Set(), minPuan: 1 };
  buildFilterChips();
  render();
});

loadEntries();
</script>
